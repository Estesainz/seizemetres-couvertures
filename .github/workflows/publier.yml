name: Publier les Reels planifiés
on:
  push:
    branches: [main]
    paths: ["planning/**"]
  workflow_dispatch:
  schedule:
    # Réveil de secours ~30 min avant chaque créneau habituel (heure de Zurich en hiver = UTC+1).
    # Si une run dort déjà, celui-ci attend simplement son tour : jamais de doublon.
    - cron: "30 6,11,16,18,19 * * *"
concurrency:
  group: publication
  # Un ajout au planning (push) remplace la run qui dort, pour voir la nouvelle entrée.
  # Une relance (workflow_dispatch) ne tue jamais une run en cours : elle attend son tour.
  cancel-in-progress: ${{ github.event_name == 'push' }}
permissions:
  contents: write
  actions: write
jobs:
  publier:
    runs-on: ubuntu-latest
    timeout-minutes: 358
    steps:
      - uses: actions/checkout@v4
      - name: Publier à l'heure prévue
        timeout-minutes: 345
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          IG_USER_ID: "17841466732905761"
        run: |
          git config user.name "Seize Metres robot"
          git config user.email "noreply@github.com"
          python3 robot/publier_planifie.py
      - name: Relais automatique (tant qu'il reste des Reels à publier)
        if: always() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          ECHEC: ${{ job.status != 'success' }}
        run: |
          git pull -q --rebase origin main || true
          RESTE=$(python3 -c "import glob,json;print(sum(1 for c in glob.glob('planning/*.json') if not json.load(open(c)).get('statut')))")
          echo "Entrées en attente : $RESTE"
          if [ "$RESTE" -gt 0 ]; then
            if [ "$ECHEC" = "true" ]; then sleep 120; fi
            gh workflow run publier.yml --ref main && echo "Run suivante lancée."
          fi
